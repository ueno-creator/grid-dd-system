name: Grid System Patrol and AI Self-Healing

on:
  schedule:
    # 毎朝 6:00 JST (UTC 21:00) に自動巡回
    - cron: '0 21 * * *'
  workflow_dispatch: # 管理画面から今すぐ実行も可能

jobs:
  patrol-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: システム巡回テストの実行
        id: run_patrol
        continue-on-error: true
        run: |
          python - << 'EOF' > patrol_report.json
          import re, json, sys, requests

          report = {"status": "success", "errors": []}
          try:
              with open("oita_grid_capacity_map.html", "r", encoding="utf-8") as f:
                  content = f.read()
              if "</html>" not in content or "</body>" not in content:
                  report["errors"].append("HTML終端タグが欠損しています")
              subs = re.findall(r"id:\s*'([^']+)'", content)
              if len(set(subs)) < 48:
                  report["errors"].append(f"変電所マスタ不足: {len(set(subs))}件 (必要: 48件)")
          except Exception as e:
              report["status"] = "failed"
              report["errors"].append(str(e))

          with open("patrol_report.json", "w", encoding="utf-8") as out:
              json.dump(report, out, ensure_ascii=False)

          if report["errors"]:
              sys.exit(1)
          EOF

      - name: エラー検知時：Gemini AI による自動修復
        if: steps.run_patrol.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import json, os, sys, requests

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              sys.exit(0)

          with open("patrol_report.json", "r", encoding="utf-8") as f:
              report = json.load(f)
          with open("oita_grid_capacity_map.html", "r", encoding="utf-8") as f:
              code = f.read()

          prompt = f"以下のエラーを修復したHTMLコードのみを出力してください。\nエラー: {report['errors']}\nコード:\n{code}"
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={api_key}"
          res = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]}, timeout=120)
          if res.status_code == 200:
              text = res.json()["candidates"][0]["content"]["parts"][0]["text"]
              if "
```html" in text:
                  text = text.split("
```html")[1].split("```")[0].strip()
              elif "
```" in text:
                  text = text.split("
```")[1].split("```")[0].strip()
              with open("oita_grid_capacity_map.html", "w", encoding="utf-8") as f:
                  f.write(text)
          EOF

      - name: 修正パッチの自動コミット・プッシュ
        if: steps.run_patrol.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b auto-fix/patrol-$(date +'%Y%m%d-%H%M%S')
          git add oita_grid_capacity_map.html
          git commit -m "🤖 [AI自動修復] システム定期巡回による不具合修正"
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
