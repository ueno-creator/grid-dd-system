name: Grid System Patrol and AI Self-Healing

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  patrol-and-heal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          python -m pip install --upgrade pip
          pip install requests

      - id: run_patrol
        continue-on-error: true
        run: |
          python - << 'EOF'
          import re, json, sys

          report = {"status": "success", "errors": []}
          try:
              with open("oita_grid_capacity_map.html", "r", encoding="utf-8") as f:
                  content = f.read()

              if len(content.strip()) < 1000:
                  report["errors"].append("HTMLファイルの内容が不完全または空です")
              if "</html>" not in content:
                  report["errors"].append("HTML終了タグがありません")
          except Exception as e:
              report["status"] = "failed"
              report["errors"].append(f"ファイル読込エラー: {str(e)}")

          with open("patrol_report.json", "w", encoding="utf-8") as out:
              json.dump(report, out, ensure_ascii=False, indent=2)

          print("--- 巡回診断レポート ---")
          print(json.dumps(report, ensure_ascii=False, indent=2))

          if report["errors"]:
              sys.exit(1)
          EOF

      - if: steps.run_patrol.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat patrol_report.json
          python - << 'EOF'
          import json, os, sys, requests

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("GEMINI_API_KEY が設定されていません")
              sys.exit(0)

          with open("patrol_report.json", "r", encoding="utf-8") as f:
              report = json.load(f)

          print(f"AI修復を実行中: {report['errors']}")
          EOF

      - if: steps.run_patrol.outcome == 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add oita_grid_capacity_map.html
          if git diff --staged --quiet; then
            echo "変更差分がないためコミットをスキップします。"
          else
            git checkout -b auto-fix/patrol-$(date +'%Y%m%d-%H%M%S')
            git commit -m "🤖 [AI修復] 定期巡回による自動修正"
            git push origin HEAD
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
